<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リソカメラ ライブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFF2;
  --panel:#FFFFFF;
  --ink:#0B2A7A;
  --blue:#0078BF;
  --pink:#FF48B0;
  --t-blue:#0078BF;
  --t-pink:#FF48B0;
  --blend:multiply;
  --line:rgba(11,42,122,.22);
  --on-pink:#2A0A1E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1030; --panel:#161B4A; --ink:#E9E6FF;
    --t-blue:#4DB3FF; --t-pink:#FF5CB8; --blend:screen;
    --line:rgba(233,230,255,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1030; --panel:#161B4A; --ink:#E9E6FF;
  --t-blue:#4DB3FF; --t-pink:#FF5CB8; --blend:screen;
  --line:rgba(233,230,255,.25);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-weight:500;font-size:15px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px;}

.app{max-width:500px;margin:0 auto;padding:18px 16px 40px;}
header{padding:6px 0 16px;}
h1{
  position:relative;display:inline-block;margin:0;
  font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;
  font-size:clamp(42px,13vw,64px);line-height:1.05;letter-spacing:.02em;
  color:var(--t-blue);
}
h1::after{
  content:attr(data-t);position:absolute;left:4px;top:3px;
  color:var(--t-pink);mix-blend-mode:var(--blend);pointer-events:none;
}
.sub{margin:8px 0 0;font-weight:700;}

.vf{position:relative;border:2px solid var(--ink);background:#fff;overflow:hidden;border-radius:4px;}
#cv{display:block;width:100%;height:auto;aspect-ratio:3/4;}
.chip{
  position:absolute;left:10px;top:10px;padding:2px 10px;border-radius:99px;
  background:var(--paper);border:2px solid var(--ink);font-size:12px;font-weight:700;
}
.start{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;}
.start>*{flex:1;}
.start[hidden],.chip[hidden]{display:none;}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.flash.go{animation:fl .24s ease-out;}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:8px 14px;border:2px solid var(--ink);border-radius:6px;
  background:var(--paper);font-weight:700;text-align:center;
}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--pink);}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pink);}

.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:18px 0 6px;}
.row .l{justify-self:start;}
.row .r{justify-self:end;}
.note{margin:0;font-size:12px;text-align:center;opacity:.8;}
.round{
  width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--panel);
  display:grid;place-items:center;color:var(--ink);padding:0;
}
.round svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#shutter{
  width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);
  background:var(--pink);box-shadow:5px 5px 0 var(--blue);padding:0;
  transition:transform .08s,box-shadow .08s;
}
#shutter:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--blue);}

.controls{margin-top:22px;display:grid;gap:14px;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden;}
.seg button{border:0;background:var(--panel);padding:10px 4px;font-weight:700;min-height:44px;}
.seg button+button{border-left:2px solid var(--ink);}
.seg button[aria-checked="true"]{background:var(--blue);color:#fff;}
.sl{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;}
.sl label{font-weight:700;}
.sl output{font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right;}
.sl input{grid-column:1/-1;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--pink));}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--pink));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--panel);border:3px solid var(--ink);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--ink);}
.toggles{display:flex;gap:10px;flex-wrap:wrap;}
.tg{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:99px;background:var(--panel);padding:7px 16px;min-height:44px;font-weight:700;}
.tg[aria-pressed="true"]{background:var(--pink);color:var(--on-pink);}

.shots{margin-top:26px;}
.shots h2{font-size:16px;margin:0 0 10px;font-weight:700;}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;}
.strip button{flex:0 0 96px;padding:0;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff;aspect-ratio:3/4;}
.strip img{display:block;width:100%;height:100%;object-fit:cover;}
.empty{margin:0;opacity:.8;}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  max-width:min(92vw,440px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;
  font-weight:700;font-size:14px;z-index:30;
}
.toast[hidden]{display:none;}

.viewer{position:fixed;inset:0;z-index:20;background:rgba(8,10,40,.86);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));}
.viewer[hidden]{display:none;}
.vbox{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;}
.vbox img{max-width:min(92vw,480px);max-height:68vh;object-fit:contain;background:#fff;border:2px solid #fff;border-radius:2px;-webkit-touch-callout:default;user-select:auto;}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.vbtns .btn{min-width:84px;}
.hint{margin:0;color:#fff;font-size:13px;text-align:center;}
.nogl{border:2px solid var(--pink);padding:12px;border-radius:6px;margin:12px 0;font-weight:700;}
.nogl[hidden]{display:none;}

@media (min-width:880px){
  .app{max-width:1000px;display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);column-gap:40px;align-items:start;}
  header{grid-column:1/-1;}
  .controls{margin-top:0;}
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1 data-t="リソカメラ">リソカメラ</h1>
    <p class="sub">青とピンク、2色のインクだけで撮るカメラ。</p>
  </header>

  <div class="colA">
    <p class="nogl" id="nogl" hidden>このブラウザはWebGLに対応していないため動きません。別のブラウザでお試しください。</p>
    <section class="vf" aria-label="ファインダー">
      <canvas id="cv" width="720" height="960" role="img" aria-label="2色リソグラフ風に加工されたプレビュー"></canvas>
      <span class="chip" id="chip">デモ画像で試し中</span>
      <div class="flash" id="flash"></div>
      <div class="start" id="start">
        <button class="btn primary" id="camBtn" type="button">カメラをはじめる</button>
        <label class="btn" for="file">写真を選ぶ</label>
      </div>
    </section>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fileSelfie" accept="image/*" capture="user" hidden>
    <video id="video" playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

    <div class="row">
      <button class="round l" id="flip" type="button" aria-label="インカメラとアウトカメラを切り替える" title="カメラ切り替え">
        <svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></svg>
      </button>
      <button id="shutter" type="button" aria-label="いまの画面を刷る"></button>
      <label class="round r" for="file" aria-label="写真を選ぶ" title="写真を選ぶ">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      </label>
    </div>
    <p class="note">左：カメラ切り替え　中央：シャッター　右：写真を選ぶ</p>
  </div>

  <div class="colB">
    <section class="controls" aria-label="仕上がりの調整">
      <div class="seg" role="radiogroup" aria-label="質感" id="modes">
        <button type="button" role="radio" aria-checked="true" data-m="0">ハーフトーン</button>
        <button type="button" role="radio" aria-checked="false" data-m="1">ざらざら</button>
        <button type="button" role="radio" aria-checked="false" data-m="2">ベタ</button>
      </div>
      <div id="sliders" style="display:grid;gap:10px"></div>
      <div class="toggles">
        <button class="tg" id="swap" type="button" aria-pressed="false">青とピンクを入れ替え</button>
        <button class="tg" id="frame" type="button" aria-pressed="true">フチをつけて保存</button>
        <label class="tg" for="fileCam">標準カメラで撮る</label>
      </div>
    </section>

    <section class="shots" aria-label="撮った写真">
      <h2>撮った写真 <span id="count"></span></h2>
      <p class="empty" id="empty">シャッターを押すと、ここに刷り上がります。</p>
      <div class="strip" id="strip"></div>
    </section>
  </div>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="撮った写真">
  <div class="vbox">
    <img id="vimg" alt="刷り上がった写真">
    <div class="vbtns">
      <button class="btn primary" id="vsave" type="button" hidden>保存する</button>
      <button class="btn" id="vshare" type="button" hidden>共有</button>
      <button class="btn" id="vdel" type="button">削除</button>
      <button class="btn" id="vclose" type="button">閉じる</button>
    </div>
    <p class="hint">画像を長押し（PCは右クリック）でも保存できます。</p>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const canvas = $('#cv');
  const gl = canvas.getContext('webgl', {preserveDrawingBuffer:true, antialias:false, alpha:false});
  if (!gl) { $('#nogl').hidden = false; return; }

  /* ---------- Shader ---------- */
  const VS = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;
  const FS = `
precision highp float;
uniform sampler2D tex;
uniform vec2 res, src, off;
uniform float mirror, cell, grain, contrast, bright, mode, ks;
uniform vec3 inkA, inkB, paper;

float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y);
}
vec2 cover(vec2 u){
  float A=res.x/res.y, S=src.x/src.y;
  if(S>A) u.x=(u.x-.5)*(A/S)+.5; else u.y=(u.y-.5)*(S/A)+.5;
  if(mirror>.5) u.x=1.-u.x;
  return u;
}
float lum(vec2 u){
  vec3 c=texture2D(tex,cover(clamp(u,0.,1.))).rgb;
  float l=dot(c,vec3(.299,.587,.114));
  return clamp((l-.5)*contrast+.5+bright,0.,1.);
}
float screenH(vec2 p,float a){
  float c=cos(a), s=sin(a);
  vec2 q=vec2(c*p.x+s*p.y,-s*p.x+c*p.y)*6.28318/cell;
  return .5+.25*(cos(q.x)+cos(q.y));
}
float coverage(float d, vec2 p, float a){
  float cov;
  if(mode<.5){
    float h=screenH(p,a);
    float aa=.12;
    float thr=1.+aa-d*(1.+2.*aa);
    cov=smoothstep(thr-aa,thr+aa,h);
  } else if(mode<1.5){
    float g=max(1.,cell*.28);
    vec2 cp=floor(p/g);
    float n=hash(cp+a*17.);
    n=mix(n,hash(floor(cp/2.)+a*5.),.35);
    cov=smoothstep(n-.06,n+.06,d*1.05);
  } else {
    float n=(vnoise(p/(cell*.6)+a*9.)-.5)*.22;
    cov=smoothstep(.31,.39,d+n);
  }
  float sp=vnoise(p*.9+a*13.)*.6+hash(floor(p)+a)*.4;
  cov*=1.-grain*.9*smoothstep(.55,.9,sp);
  cov*=1.-grain*.3*vnoise(p*.03+a*3.);
  return cov;
}
void main(){
  vec2 fc=gl_FragCoord.xy/ks;
  vec2 pa=fc+off*.5, pb=fc-off*.5;
  float La=lum(pa*ks/res), Lb=lum(pb*ks/res);
  float dA=clamp(pow(1.-La,1.7)*1.15,0.,1.);
  float dB=pow(clamp(1.-Lb*.9,0.,1.),1.15);
  float cA=coverage(dA,pa,1.309);
  float cB=coverage(dB,pb,.262);
  vec3 col=paper;
  col*=mix(vec3(1.),inkB,cB*.92);
  col*=mix(vec3(1.),inkA,cA*.96);
  col*=1.-.04*hash(gl_FragCoord.xy)-.03*vnoise(fc*.05);
  gl_FragColor=vec4(col,1.);
}`;
  function sh(type, srcText){
    const s = gl.createShader(type); gl.shaderSource(s, srcText); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); $('#nogl').hidden = false; return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  ['tex','res','src','off','mirror','cell','grain','contrast','bright','mode','ks','inkA','inkB','paper']
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.uniform1i(U.tex, 0);

  /* ---------- State ---------- */
  const BLUE = [0, .47, .75], PINK = [1, .28, .69], PAPER = [.97, .96, .95];
  const P = {mode:0, dot:7, mis:6, grain:.5, contrast:1.25, bright:0, swap:false, frame:true, ang:.6};
  let S = {el:null, w:720, h:960, live:false, mirror:false};
  let dirty = true;

  function upload(el){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
  }
  function draw(){
    gl.viewport(0, 0, canvas.width, canvas.height);
    const k = canvas.width / 720;
    gl.uniform2f(U.res, canvas.width, canvas.height);
    gl.uniform2f(U.src, S.w, S.h);
    gl.uniform1f(U.mirror, S.mirror ? 1 : 0);
    gl.uniform1f(U.cell, P.dot);
    gl.uniform1f(U.ks, k);
    gl.uniform2f(U.off, Math.cos(P.ang) * P.mis, Math.sin(P.ang) * P.mis);
    gl.uniform1f(U.grain, P.grain);
    gl.uniform1f(U.contrast, P.contrast);
    gl.uniform1f(U.bright, P.bright);
    gl.uniform1f(U.mode, P.mode);
    gl.uniform3fv(U.inkA, P.swap ? PINK : BLUE);
    gl.uniform3fv(U.inkB, P.swap ? BLUE : PINK);
    gl.uniform3fv(U.paper, PAPER);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* ---------- Demo image ---------- */
  function makeDemo(){
    const c = document.createElement('canvas'); c.width = 720; c.height = 960;
    const x = c.getContext('2d');
    let g = x.createLinearGradient(0,0,0,960);
    g.addColorStop(0,'#fafafa'); g.addColorStop(.55,'#9c9c9c'); g.addColorStop(.56,'#4a4a4a'); g.addColorStop(1,'#0e0e0e');
    x.fillStyle = g; x.fillRect(0,0,720,960);
    x.fillStyle = 'rgba(0,0,0,.55)';
    x.beginPath(); x.ellipse(350,712,250,38,0,0,7); x.fill();
    let r = x.createRadialGradient(270,380,20,340,450,240);
    r.addColorStop(0,'#ffffff'); r.addColorStop(.45,'#a8a8a8'); r.addColorStop(1,'#161616');
    x.fillStyle = r; x.beginPath(); x.arc(340,470,240,0,7); x.fill();
    let r2 = x.createRadialGradient(560,250,6,580,280,70);
    r2.addColorStop(0,'#fff'); r2.addColorStop(1,'#555');
    x.fillStyle = r2; x.beginPath(); x.arc(585,280,70,0,7); x.fill();
    x.fillStyle = '#e8e8e8';
    for (let i = 0; i < 6; i++) x.fillRect(60 + i*18, 780 + i*8, 12, 120 - i*8);
    return c;
  }
  S = {el: makeDemo(), w: 720, h: 960, live: false, mirror: false};
  upload(S.el);

  /* ---------- Camera ---------- */
  const video = $('#video'); let stream = null; let facing = 'environment';
  const startEl = $('#start'), chip = $('#chip');
  function stopStream(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  async function startCamera(quiet){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (!quiet) toast('このブラウザではカメラを使えません。「標準カメラで撮る」をお使いください。'); return false;
    }
    try {
      stopStream();
      stream = await navigator.mediaDevices.getUserMedia({
        video: {facingMode: {ideal: facing}, width: {ideal: 1280}, height: {ideal: 1280}}, audio: false
      });
      video.srcObject = stream;
      await video.play();
      const st = stream.getVideoTracks()[0].getSettings();
      S = {el: video, w: video.videoWidth || 720, h: video.videoHeight || 960, live: true, mirror: st.facingMode !== 'environment'};
      startEl.hidden = true; chip.hidden = true;
      return true;
    } catch (e) {
      if (quiet) return false;
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      toast(denied
        ? 'カメラが許可されていません。ブラウザの設定を確認するか、「標準カメラで撮る」をお使いください。'
        : 'カメラを起動できませんでした。「標準カメラで撮る」をお使いください。');
      return false;
    }
  }
  $('#camBtn').addEventListener('click', () => startCamera());
  $('#flip').addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); });
  window.addEventListener('pagehide', stopStream);

  function onPhoto(e){
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f); const img = new Image();
    img.onload = () => {
      const max = 2048, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      stopStream();
      S = {el: c, w: c.width, h: c.height, live: false, mirror: false};
      upload(c); draw(); dirty = true; startEl.hidden = true; chip.hidden = true;
      shoot().then(ok => { if (ok) openViewer(0); });
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('画像を読み込めませんでした。'); };
    img.src = url; e.target.value = '';
  }
  ['#file', '#fileCam', '#fileSelfie'].forEach(id => $(id).addEventListener('change', onPhoto));

  /* ---------- Render loop ---------- */
  function tick(){
    try {
      if (S.live && video.readyState >= 2) {
        if (video.videoWidth) { S.w = video.videoWidth; S.h = video.videoHeight; }
        upload(video); draw();
      } else if (dirty) { draw(); dirty = false; }
    } catch (e) { console.error(e); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  startCamera(true);

  /* ---------- Controls ---------- */
  const modes = $('#modes');
  modes.addEventListener('click', e => {
    const b = e.target.closest('button[data-m]'); if (!b) return;
    P.mode = +b.dataset.m;
    modes.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b ? 'true' : 'false'));
    dirty = true;
  });
  const SL = [
    {k:'dot', label:'粒の大きさ', min:3, max:16, step:.5, fmt:v => v},
    {k:'mis', label:'版ずれ', min:0, max:24, step:.5, fmt:v => v},
    {k:'grain', label:'インクのかすれ', min:0, max:1, step:.05, fmt:v => Math.round(v*100) + '%'},
    {k:'contrast', label:'コントラスト', min:.6, max:2.2, step:.05, fmt:v => v.toFixed(2)},
    {k:'bright', label:'明るさ', min:-.3, max:.3, step:.01, fmt:v => (v > 0 ? '+' : '') + Math.round(v*100)}
  ];
  const slWrap = $('#sliders');
  SL.forEach(s => {
    const d = document.createElement('div'); d.className = 'sl';
    const l = document.createElement('label'); l.htmlFor = 'sl-' + s.k; l.textContent = s.label;
    const o = document.createElement('output'); o.htmlFor = 'sl-' + s.k;
    const i = document.createElement('input');
    i.type = 'range'; i.id = 'sl-' + s.k; i.min = s.min; i.max = s.max; i.step = s.step; i.value = P[s.k];
    const upd = () => { P[s.k] = parseFloat(i.value); o.textContent = s.fmt(P[s.k]); dirty = true; };
    i.addEventListener('input', upd); o.textContent = s.fmt(P[s.k]);
    d.append(l, o, i); slWrap.append(d);
  });
  const swapBtn = $('#swap'), frameBtn = $('#frame');
  swapBtn.addEventListener('click', () => { P.swap = !P.swap; swapBtn.setAttribute('aria-pressed', P.swap); dirty = true; });
  frameBtn.addEventListener('click', () => { P.frame = !P.frame; frameBtn.setAttribute('aria-pressed', P.frame); });

  /* ---------- Toast ---------- */
  const toastEl = $('#toast'); let tt;
  function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(() => toastEl.hidden = true, 3600); }

  /* ---------- Capture ---------- */
  const pad = n => String(n).padStart(2, '0');
  function mark(x, cx, cy, r, color, dx, dy){
    x.strokeStyle = color; x.lineWidth = Math.max(2, r * .14);
    x.beginPath(); x.arc(cx + dx, cy + dy, r * .6, 0, 7); x.stroke();
    x.beginPath(); x.moveTo(cx + dx - r, cy + dy); x.lineTo(cx + dx + r, cy + dy);
    x.moveTo(cx + dx, cy + dy - r); x.lineTo(cx + dx, cy + dy + r); x.stroke();
  }
  function compose(now){
    const w = canvas.width, h = canvas.height;
    const m = P.frame ? Math.round(w * .055) : 0, mb = P.frame ? Math.round(w * .16) : 0;
    const c = document.createElement('canvas'); c.width = w + m*2; c.height = h + m + mb;
    const x = c.getContext('2d');
    if (P.frame) { x.fillStyle = '#F7F3F0'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(canvas, m, m);
    if (P.frame) {
      x.globalCompositeOperation = 'multiply';
      const r = m * .3;
      mark(x, c.width / 2, m / 2, r, '#FF48B0', 0, 0);
      mark(x, c.width / 2, m / 2, r, '#0078BF', 2, 1.5);
      const fs = Math.round(mb * .22);
      x.fillStyle = '#0078BF'; x.textBaseline = 'middle';
      x.font = `700 ${fs}px "Zen Kaku Gothic New","Hiragino Sans",sans-serif`;
      x.fillText(`${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}`, m, m + h + mb * .5);
      const sr = mb * .22, sy = m + h + mb * .5, sx = c.width - m - sr * 2.2;
      x.fillStyle = '#FF48B0'; x.beginPath(); x.arc(sx, sy, sr, 0, 7); x.fill();
      x.fillStyle = '#0078BF'; x.beginPath(); x.arc(sx + sr * 1.2, sy, sr, 0, 7); x.fill();
      x.globalCompositeOperation = 'source-over';
    }
    return c;
  }
  const shots = [];
  let busy = false;
  async function shoot(){
    if (busy) return false; busy = true;
    try {
      try { navigator.vibrate && navigator.vibrate(15); } catch (e) {}
      const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      const ow = canvas.width, oh = canvas.height;
      if (S.live && video.readyState >= 2) upload(video);
      canvas.width = 1080; canvas.height = 1440;
      draw();
      const now = new Date();
      const out = compose(now);
      canvas.width = ow; canvas.height = oh; dirty = true;
      const blob = await new Promise(r => out.toBlob(r, 'image/png'));
      if (!blob) { toast('保存用の画像を作れませんでした。'); return false; }
      const name = `riso-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
      shots.unshift({blob, name, url: URL.createObjectURL(blob)});
      P.ang += (Math.random() - .5) * 2.4;
      renderShots();
      toast('刷れました。');
      return true;
    } finally { busy = false; }
  }
  $('#shutter').addEventListener('click', shoot);

  /* ---------- Gallery / viewer ---------- */
  const strip = $('#strip'), empty = $('#empty'), count = $('#count');
  function renderShots(){
    strip.textContent = '';
    empty.hidden = shots.length > 0;
    count.textContent = shots.length ? `(${shots.length})` : '';
    shots.forEach((s, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `${shots.length - i}枚目の写真を開く`);
      const im = document.createElement('img'); im.src = s.url; im.alt = '';
      b.append(im); b.addEventListener('click', () => openViewer(i)); strip.append(b);
    });
  }
  const viewer = $('#viewer'), vimg = $('#vimg'); let cur = -1;
  let dl = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(d => { dl = d || null; }).catch(() => {});
    }
  } catch (e) {}
  const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({files: [new File(['x'], 'a.png', {type: 'image/png'})]})); } catch (e) { return false; } })();
  function openViewer(i){
    cur = i; vimg.src = shots[i].url; viewer.hidden = false;
    $('#vsave').hidden = false; // 保存は常に試す（使えない場合は案内を出す）
    $('#vshare').hidden = !canShareFiles;
    $('#vclose').focus();
  }
  function closeViewer(){ viewer.hidden = true; cur = -1; }
  $('#vclose').addEventListener('click', closeViewer);
  viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !viewer.hidden) closeViewer(); });
  $('#vdel').addEventListener('click', () => {
    if (cur < 0) return;
    URL.revokeObjectURL(shots[cur].url); shots.splice(cur, 1); renderShots(); closeViewer();
  });
  $('#vsave').addEventListener('click', async () => {
    const s = shots[cur]; if (!s) return;
    if (!dl) {
      const a = document.createElement('a'); a.href = s.url; a.download = s.name;
      document.body.appendChild(a); a.click(); a.remove(); return;
    }
    try { await dl.save({filename: s.name, data: s.blob}); toast('保存しました。'); }
    catch (e) { if (e && e.code === 'declined') return; toast('保存できませんでした。画像を長押しして保存してください。'); }
  });
  $('#vshare').addEventListener('click', async () => {
    const s = shots[cur]; if (!s) return;
    try { await navigator.share({files: [new File([s.blob], s.name, {type: 'image/png'})], title: 'リソカメラ'}); }
    catch (e) { /* キャンセルは無視 */ }
  });
})();
</script>
</body>
</html>
